name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from module.prop
        id: version
        run: echo "VERSION=$(grep '^version=' module.prop | cut -d= -f2)" >> $GITHUB_OUTPUT

      - name: Build flashable zip
        run: |
          ZIP_NAME="cpu-screenoff-${{ steps.version.outputs.VERSION }}.zip"
          zip -r "$ZIP_NAME" \
            META-INF/ \
            module.prop \
            service.sh \
            config.sh \
            README.md \
            LICENSE
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}
          body: |
            ## CPU Screen Off ${{ steps.version.outputs.VERSION }}

            Flash via Magisk Manager or KernelSU. See README for configuration.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
